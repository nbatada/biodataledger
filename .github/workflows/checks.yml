name: Native R and Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      R_LIBS_USER: ${{ github.workspace }}/.r-library
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.3'
      - name: Create local R library
        run: mkdir -p "$R_LIBS_USER"
      - name: Install declared R dependencies
        run: Rscript -e 'install.packages(c("jsonlite","digest","zip","uuid","stringi"), repos="https://cloud.r-project.org")'
      - name: Install both native clients
        run: |
          python -m pip install ./python
          mkdir -p .r-library
          R CMD INSTALL -l "$PWD/.r-library" r
      - name: Installed-package and README tests
        run: BDL_R_LIB="$PWD/.r-library" python -m unittest discover -s tests -p 'test_*.py' -v
      - name: R package check
        run: |
          R CMD build r
          R CMD check --no-manual BioDataLedger_0.4.0.tar.gz
          grep -q "^Status: OK" BioDataLedger.Rcheck/00check.log
