[metadata]
name = biodataledger
version = 0.13.0
description = Explicit scientific project records and selected portable bundles
long_description = file: README.md
long_description_content_type = text/markdown
author = Nizar Batada
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
biodataledger = project.schema.json, API_0.5.0.md, API_0.6.0.md, API_0.7.0.md, API_0.8.0.md, API_0.9.0.md, API_0.10.0.md, API_0.11.0.md, CHRONOLOGY_V1.md, COMPARISONS_V1.md, PROTOCOLS_V1.md, OBJECT_CHECK_V1.md, RESULTS_V1.md, EXECUTION_V1.md, DECISIONS_V1.md, RELATED_WORK_V1.md, GRAPH_V1.md
