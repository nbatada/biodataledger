[metadata]
name = biodataledger
version = 0.3.0
description = Explicit scientific project records and selected portable bundles
long_description = file: README.md
long_description_content_type = text/markdown
author = Nizar Batada
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
biodataledger = project.schema.json, API_0.3.0.md
